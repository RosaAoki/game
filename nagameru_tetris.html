<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TETRIS ★</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(180deg,#0a0a1a,#08080f);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:14px 8px 40px;
  font-family:'Courier New',monospace;user-select:none;color:#fff}
h1{color:#FFD700;font-size:15px;letter-spacing:6px;margin-bottom:14px}
.game-area{display:flex;gap:10px;align-items:flex-start}
#board{border:2px solid #1a1a32;background:#06061a;display:block;flex-shrink:0;
  transition:border-color .12s,box-shadow .12s}
#board.flash{border-color:#FFD700;box-shadow:0 0 20px rgba(255,215,0,.4)}
#board.spec-fall{animation:specBlink .6s ease-in-out infinite}
@keyframes specBlink{
  0%,100%{border-color:#1a1a32;box-shadow:none}
  50%{border-color:#FFD700;box-shadow:0 0 14px rgba(255,215,0,.55)}
}
.side{display:flex;flex-direction:column;gap:10px;width:74px}
.lbl{color:#2a2a50;font-size:9px;letter-spacing:1px}
.val{font-size:13px;font-weight:700}
#next-c{background:#06061a;border:1px solid #1a1a32;border-radius:4px;display:block}
.spec{color:#FFD700;font-size:13px;font-weight:700;letter-spacing:2px;
  text-align:center;margin-top:10px;min-height:20px}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.4}}
.controls{display:flex;gap:8px;margin-top:18px;justify-content:center;flex-wrap:wrap}
.ctrl{width:52px;height:52px;border-radius:10px;font-size:20px;cursor:pointer;
  font-family:inherit;-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;
  border:1px solid #1e1e40;background:#12122a;color:#aaa;touch-action:none}
.ctrl.gold{background:#1a1a0a;border-color:#5a5a20;color:#FFD700}
.hint{color:#1a1a32;font-size:10px;margin-top:12px;text-align:center;line-height:1.9}
.auto-btn,#auto-btn,#speed-btn{padding:8px 18px;border-radius:20px;
  background:#12122a;border:1px solid #24244a;color:#888;font-family:inherit;
  font-size:12px;letter-spacing:1px;cursor:pointer}
#auto-btn.on{background:#1a1a0a;border-color:#5a5a20;color:#FFD700}
#speed-btn.fast{background:#1a1a0a;border-color:#5a5a20;color:#FFD700}
.frag-counter{margin-top:10px;color:#FFD700;font-size:12px;letter-spacing:1px;cursor:pointer;
  text-align:center;text-decoration:underline dotted;text-underline-offset:3px}
.frag-ov{display:none;position:fixed;inset:0;z-index:50;
  background:radial-gradient(ellipse at center,#142035 0%,#05070d 80%);
  align-items:center;justify-content:center;cursor:pointer;padding:20px 20px calc(20px + 35vh)}
.frag-book{max-width:320px;text-align:center;color:#fff;font-size:15px;line-height:2;
  border:1px solid rgba(255,215,0,.3);border-radius:10px;padding:30px 24px;
  background:rgba(10,10,25,.4);animation:fragIn .5s ease}
@keyframes fragIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.frag-tag{color:#FFD700;font-size:10px;letter-spacing:3px;margin-bottom:14px;opacity:.8}
.frag-hint{margin-top:18px;font-size:10px;color:#666}
.coll-ov{display:none;position:fixed;inset:0;z-index:50;background:rgba(4,4,12,.92);
  align-items:center;justify-content:center;padding:20px}
.coll-card{max-width:340px;width:100%;max-height:80vh;overflow-y:auto;background:#0d0d20;
  border:1px solid #24244a;border-radius:10px;padding:16px}
.coll-head{display:flex;justify-content:space-between;color:#FFD700;font-size:13px;
  letter-spacing:1px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #24244a}
#coll-close{cursor:pointer;color:#888}
.coll-item{font-size:12px;line-height:1.8;padding:8px 0;border-bottom:1px dashed #1a1a32;color:#ddd}
.coll-item.locked{color:#333}
.ov{position:absolute;inset:0;background:rgba(6,6,26,.9);z-index:30;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.chain-pop{position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;pointer-events:none}
.chain-pop span{color:#fff;font-weight:900;font-size:34px;letter-spacing:1px;
  text-shadow:0 0 18px rgba(255,255,255,.85),0 0 8px #FFD700;
  animation:chainPop 1s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes chainPop{
  0%{transform:scale(2.6);opacity:0}
  32%{transform:scale(1);opacity:1}
  68%{transform:scale(1);opacity:1}
  100%{transform:scale(1);opacity:0}
}
.bwrap{position:relative}
.start-btn{padding:11px 32px;background:#FFD700;border:none;border-radius:7px;
  color:#000;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;letter-spacing:1px}
#pause-btn{display:none}
</style>
</head>
<body>
<h1>✦Nagameru TETRIS ✦</h1>
<div class="game-area">
  <div class="bwrap">
    <canvas id="board"></canvas>
    <div class="chain-pop" id="chain-pop"></div>
    <div class="ov" id="ov">
      <div id="ov-title"></div>
      <div style="color:#444;font-size:12px" id="ov-sub"></div>
      <button class="start-btn" id="start-btn">スタート</button>
    </div>
  </div>
  <div class="side">
    <div class="lbl">NEXT</div>
    <canvas id="next-c" width="60" height="60"></canvas>
    <div style="margin-top:4px"><div class="lbl">SCORE</div><div class="val" style="color:#FFD700" id="el-score">0</div></div>
    <div style="margin-top:4px"><div class="lbl">BEST</div><div class="val" style="color:#f0a000" id="el-best">0</div></div>
    <div style="margin-top:4px"><div class="lbl">LV</div><div class="val" style="color:#a5d6a7" id="el-lvl">1</div></div>
    <div style="margin-top:4px"><div class="lbl">LINES</div><div class="val" style="color:#90caf9" id="el-lines">0</div></div>
  </div>
</div>
<div class="spec" id="spec-lbl"></div>
<div class="controls">
  <button class="ctrl" id="bl">◀</button>
  <button class="ctrl" id="brot">↻</button>
  <button class="ctrl" id="bd">▼</button>
  <button class="ctrl" id="br">▶</button>
  <button class="ctrl gold" id="bhd">⬇</button>
  <button class="ctrl" id="pause-btn">⏸</button>
</div>
<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px">
<button id="auto-btn">AUTO: OFF</button>
<button id="speed-btn">速度: 通常</button>
</div>
<div class="hint">←→: 移動　↑: 回転　↓: 落とす　スペース: 即落下<br>★ スペシャルブロックはブロックを消して地面に沈みます</div>
<div class="frag-counter" id="frag-counter">かけら: 0/0</div>

<div class="frag-ov" id="frag-ov">
  <div class="frag-book">
    <div class="frag-tag">巨神の謳</div>
    <div id="frag-page-text"></div>
    <div class="frag-hint">タップで閉じる</div>
  </div>
</div>

<div class="coll-ov" id="coll-ov">
  <div class="coll-card">
    <div class="coll-head"><span>かけらの記録</span><span id="coll-close">✕</span></div>
    <div id="coll-list"></div>
  </div>
</div>

<script>
const COLS=10,ROWS=20,CELL=28,BW=COLS*CELL,BH=ROWS*CELL;
const PS=[
  {shape:[[1,1,1,1]],color:'#26c6da'},
  {shape:[[1,1],[1,1]],color:'#ffee58'},
  {shape:[[0,1,0],[1,1,1]],color:'#ce93d8'},
  {shape:[[0,1,1],[1,1,0]],color:'#a5d6a7'},
  {shape:[[1,1,0],[0,1,1]],color:'#ef9a9a'},
  {shape:[[1,0],[1,0],[1,1]],color:'#ffcc80'},
  {shape:[[0,1],[0,1],[1,1]],color:'#90caf9'},
];
const SP={shape:[[1,1],[1,1]],color:'#FFD700',isSpecial:true};
const SC=[0,100,300,500,800];
const cv=document.getElementById('board');
const cx=cv.getContext('2d');
cv.width=BW;cv.height=BH;
const nc=document.getElementById('next-c');
const nx=nc.getContext('2d');
const LS='trt_star_best';
const getBest=()=>{try{return parseInt(localStorage.getItem(LS)||'0')}catch(e){return 0}};
const saveBest=s=>{try{if(s>getBest())localStorage.setItem(LS,String(s))}catch(e){}};

/* ===== かけら(断片)システム =====
   FRAGMENT_MS[i] = i番目のかけらを解放するのに必要な「消したライン数の累計(全プレイ通算)」
   FRAGMENTS[i]   = 解放される一文。今はダミー。あとでここだけ差し替えればいい。 */
const FRAGMENT_MS=[10,25,50,75,100,130,160,200,240,280,330,380,430,490,550,620,690,770,850,950];
const FRAGMENTS=FRAGMENT_MS.map((_,i)=>`（かけら${String(i+1).padStart(2,'0')}：ここに一文を書く）`);
const TLS='trt_star_totallines';
const FS='trt_star_frags';
const getTotalLines=()=>{try{return parseInt(localStorage.getItem(TLS)||'0')}catch(e){return 0}};
const saveTotalLines=v=>{try{localStorage.setItem(TLS,String(v))}catch(e){}};
const getFrags=()=>{try{return JSON.parse(localStorage.getItem(FS)||'[]')}catch(e){return[]}};
const saveFrags=arr=>{try{localStorage.setItem(FS,JSON.stringify(arr))}catch(e){}};
let totalLines=getTotalLines();
let unlocked=FRAGMENTS.map((_,i)=>!!getFrags()[i]);
let fragQueue=[],reading=false;
const WORDS=['音','光','記憶','約束','儚','刻','謳','奇跡','綻','証','欠片','星屑','誓い','残響'];
let floaters=[];

function renderFragCounter(){
  document.getElementById('frag-counter').textContent=
    `かけら: ${unlocked.filter(Boolean).length}/${FRAGMENTS.length}`;
}
function checkFragments(){
  const got=[];
  FRAGMENT_MS.forEach((ms,i)=>{if(!unlocked[i]&&totalLines>=ms){unlocked[i]=true;got.push(i);}});
  if(got.length){saveFrags(unlocked);renderFragCounter();
    fragQueue.push(...got);if(!reading)showNextFrag();}
}
function showNextFrag(){
  if(!fragQueue.length){reading=false;return;}
  reading=true;
  document.getElementById('frag-page-text').textContent=FRAGMENTS[fragQueue[0]];
  document.getElementById('frag-ov').style.display='flex';
}
function openCollection(){
  const list=document.getElementById('coll-list');list.innerHTML='';
  FRAGMENTS.forEach((txt,i)=>{
    const d=document.createElement('div');d.className='coll-item'+(unlocked[i]?'':' locked');
    d.textContent=`${String(i+1).padStart(2,'0')}. `+(unlocked[i]?txt:'???');
    list.appendChild(d);
  });
  document.getElementById('coll-ov').style.display='flex';
}
document.getElementById('frag-ov').addEventListener('click',()=>{
  document.getElementById('frag-ov').style.display='none';
  fragQueue.shift();
  if(fragQueue.length)setTimeout(showNextFrag,250);else reading=false;
});
document.getElementById('frag-counter').addEventListener('click',openCollection);
document.getElementById('coll-close').addEventListener('click',()=>{document.getElementById('coll-ov').style.display='none';});
document.getElementById('coll-ov').addEventListener('click',e=>{if(e.target.id==='coll-ov')e.currentTarget.style.display='none';});

let board,cur,nxt,score,lines,lvl,over,going,paused,cnt;
let sink=null,sinkCtr=0,dropCtr=0,lastT=0,combo=0;
function showChain(n){
  const el=document.getElementById('chain-pop');
  el.innerHTML=`<span>${n}chain</span>`;
}

const mkBoard=()=>Array.from({length:ROWS},()=>new Array(COLS).fill(null));
const rotSh=s=>s[0].map((_,i)=>s.map(r=>r[i]).reverse());
const fits=(sh,x,y)=>sh.every((row,dy)=>row.every((v,dx)=>{
  if(!v)return true;const[nx2,ny]=[x+dx,y+dy];
  if(nx2<0||nx2>=COLS||ny>=ROWS)return false;return ny<0||!board[ny][nx2];
}));
const stamp=(sh,x,y,c)=>sh.forEach((row,dy)=>row.forEach((v,dx)=>{
  if(v&&y+dy>=0&&y+dy<ROWS)board[y+dy][x+dx]=c;
}));

/* ===== オートモード(自動プレイ) =====
   置き方(回転×横位置)を総当たりで試し、「積み上げの高さ」「穴の数」「表面のデコボコ」
   「消せるライン数」を重みづけして一番マシな置き方を選ぶ、よくあるヒューリスティック方式。
   重みは定番の簡易Tetris AI(Yiyuan Lee氏の実装などで知られる)の値を採用。 */
const fitsOn=(b,sh,x,y)=>sh.every((row,dy)=>row.every((v,dx)=>{
  if(!v)return true;const nx2=x+dx,ny=y+dy;
  if(nx2<0||nx2>=COLS||ny>=ROWS)return false;return ny<0||!b[ny][nx2];
}));
const stampOn=(b,sh,x,y)=>sh.forEach((row,dy)=>row.forEach((v,dx)=>{
  if(v&&y+dy>=0&&y+dy<ROWS)b[y+dy][x+dx]=true;
}));
function boardMetrics(b){
  const h=new Array(COLS).fill(0);let holes=0;
  for(let x=0;x<COLS;x++){let seen=false;
    for(let y=0;y<ROWS;y++){if(b[y][x]){if(!seen){h[x]=ROWS-y;seen=true;}}else if(seen)holes++;}}
  let bump=0;for(let x=0;x<COLS-1;x++)bump+=Math.abs(h[x]-h[x+1]);
  return{agg:h.reduce((a,c)=>a+c,0),holes,bump};
}
function bestMove(piece){
  const rots=[piece.shape];let s=piece.shape;
  for(let i=0;i<3;i++){s=rotSh(s);if(!rots.some(r=>JSON.stringify(r)===JSON.stringify(s)))rots.push(s);}
  let best=null;
  rots.forEach(sh=>{
    const w=sh[0].length;
    for(let x=0;x<=COLS-w;x++){
      if(!fitsOn(board,sh,x,0)&&!fitsOn(board,sh,x,-sh.length+1))continue;
      let y=-(sh.length)+1;while(fitsOn(board,sh,x,y+1))y++;
      if(!fitsOn(board,sh,x,y))continue;
      const tmp=board.map(row=>row.map(c=>!!c));stampOn(tmp,sh,x,y);
      let lines=0;let filtered=tmp.filter(row=>{const full=row.every(c=>c);if(full)lines++;return!full;});
      while(filtered.length<ROWS)filtered.unshift(new Array(COLS).fill(false));
      const m=boardMetrics(filtered);
      const score=-0.510066*m.agg+0.760666*lines-0.35663*m.holes-0.184483*m.bump;
      if(!best||score>best.score)best={score,shape:sh,x};
    }
  });
  return best;
}
let autoOn=false,autoCtr=0,autoTarget=null,autoTargetPiece=null;
function autoStep(){
  if(!cur)return;
  if(cur!==autoTargetPiece){autoTarget=bestMove(cur);autoTargetPiece=cur;}
  if(!autoTarget)return;
  if(JSON.stringify(cur.shape)!==JSON.stringify(autoTarget.shape)){rotatePc();return;}
  if(cur.x<autoTarget.x){moveR();return;}
  if(cur.x>autoTarget.x){moveL();return;}
  soft(); // 位置が揃ったら、瞬間移動(hard)ではなく1マスずつ降ろして着地を見せる
}

function sweep(){
  const cleared=[];
  for(let y=ROWS-1;y>=0;y--){
    if(board[y].every(c=>c)){cleared.push(y);board.splice(y,1);board.unshift(new Array(COLS).fill(null));y++;}
  }
  // 同時消しで文字が重ならないよう、消えた行の数だけ横位置をずらして割り当てる
  cleared.forEach((y,i)=>{
    const slot=(i+0.5)/cleared.length;
    floaters.push({x:slot*COLS*CELL,y:y*CELL+CELL/2,
      text:WORDS[Math.floor(Math.random()*WORDS.length)],t:0,dur:900});
  });
  return cleared.length;
}

const tickMs=()=>Math.max(80,500-(lvl-1)*45);

function mkP(count=0){
  const sp=count>0&&count%7===0&&Math.random()<0.8;
  const b=sp?SP:PS[Math.floor(Math.random()*PS.length)];
  return{shape:b.shape.map(r=>[...r]),color:b.color,isSpecial:!!sp,
    x:Math.floor((COLS-b.shape[0].length)/2),y:-(b.shape.length)+1};
}

function spawnNext(){
  cur={...nxt};
  if(!fits(cur.shape,cur.x,cur.y)&&!fits(cur.shape,cur.x,cur.y+1)){gameOver();return;}
  nxt=mkP(++cnt);
}

function land(){
  if(!cur)return;
  if(cur.isSpecial){
    sink={shape:cur.shape,x:cur.x,y:cur.y};cur=null;
    document.getElementById('spec-lbl').style.animation='glow .4s infinite';
    document.getElementById('spec-lbl').textContent='✨ SPECIAL ✨';
    flash();sinkCtr=0;return;
  }
  stamp(cur.shape,cur.x,cur.y,cur.color);
  const n=sweep();
  if(n>0){
    score+=SC[Math.min(n,4)]*lvl;lines+=n;lvl=Math.floor(lines/10)+1;flash();
    totalLines+=n;saveTotalLines(totalLines);checkFragments();
    combo++;if(combo>=2){showChain(combo);score+=50*(combo-1)*lvl;}
  }else{
    combo=0;
  }
  spawnNext();
}

function sinkStep(){
  if(!sink)return;
  sink.shape.forEach((row,dy)=>row.forEach((v,dx)=>{
    if(v){const cy=sink.y+dy,cx2=sink.x+dx;
      if(cy>=0&&cy<ROWS&&cx2>=0&&cx2<COLS)board[cy][cx2]=null;}
  }));
  const ny=sink.y+1;
  if(!sink.shape.some((row,dy)=>row.some((v,dx)=>v&&ny+dy<ROWS))){
    sink=null;
    const sl=document.getElementById('spec-lbl');
    sl.textContent='';sl.style.animation='none';
    spawnNext();return;
  }
  sink.y=ny;
}

function drop(){if(!cur||sink)return;if(fits(cur.shape,cur.x,cur.y+1))cur.y++;else land();}

function gameOver(){
  over=true;going=false;saveBest(score);
  document.getElementById('ov-title').innerHTML='<span style="color:#ef5350;font-size:16px;font-weight:700;letter-spacing:2px">GAME OVER</span>';
  document.getElementById('ov-sub').textContent='Score: '+score.toLocaleString();
  document.getElementById('start-btn').textContent='もう一度';
  document.getElementById('ov').style.display='flex';
  document.getElementById('pause-btn').style.display='none';
}

function flash(){cv.classList.add('flash');setTimeout(()=>cv.classList.remove('flash'),250);}

function ui(){
  document.getElementById('el-score').textContent=score.toLocaleString();
  document.getElementById('el-best').textContent=Math.max(score,getBest()).toLocaleString();
  document.getElementById('el-lvl').textContent=lvl;
  document.getElementById('el-lines').textContent=lines;
}

function drawCell(c,x,y,color,ghost){
  if(ghost){c.strokeStyle='#1c1c38';c.setLineDash([3,3]);
    c.strokeRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2);c.setLineDash([]);return;}
  c.fillStyle=color;c.fillRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2);
  if(color==='#FFD700'){c.shadowColor='#FFD700';c.shadowBlur=10;
    c.fillRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2);c.shadowBlur=0;}
  c.fillStyle='rgba(255,255,255,0.18)';c.fillRect(x*CELL+1,y*CELL+1,CELL-2,3);c.fillRect(x*CELL+1,y*CELL+1,3,CELL-2);
  c.fillStyle='rgba(0,0,0,0.25)';c.fillRect(x*CELL+CELL-3,y*CELL+1,2,CELL-2);c.fillRect(x*CELL+1,y*CELL+CELL-3,CELL-2,2);
}

function draw(){
  cv.classList.toggle('spec-fall',!!(cur&&cur.isSpecial&&!sink));
  cx.fillStyle='#06061a';cx.fillRect(0,0,BW,BH);
  cx.strokeStyle='rgba(255,255,255,0.02)';cx.lineWidth=1;
  for(let y=0;y<ROWS;y++){cx.beginPath();cx.moveTo(0,y*CELL);cx.lineTo(BW,y*CELL);cx.stroke();}
  for(let x=0;x<COLS;x++){cx.beginPath();cx.moveTo(x*CELL,0);cx.lineTo(x*CELL,BH);cx.stroke();}
  board.forEach((row,y)=>row.forEach((c,x)=>{if(c)drawCell(cx,x,y,c);}));
  if(cur&&!sink){
    let gy=cur.y;while(fits(cur.shape,cur.x,gy+1))gy++;
    if(gy>cur.y)cur.shape.forEach((row,dy)=>row.forEach((v,dx)=>{
      if(v){const ry=gy+dy,rx=cur.x+dx;if(ry>=0&&ry<ROWS&&!board[ry][rx])drawCell(cx,rx,ry,null,true);}
    }));
  }
  if(cur)cur.shape.forEach((row,dy)=>row.forEach((v,dx)=>{
    if(v&&cur.y+dy>=0)drawCell(cx,cur.x+dx,cur.y+dy,cur.isSpecial?'#FFD700':cur.color);
  }));
  if(sink)sink.shape.forEach((row,dy)=>row.forEach((v,dx)=>{
    const cy=sink.y+dy,cx2=sink.x+dx;
    if(v&&cy>=0&&cy<ROWS&&cx2>=0&&cx2<COLS)drawCell(cx,cx2,cy,'#FFD700');
  }));
  floaters.forEach(f=>{
    const k=f.t/f.dur;cx.globalAlpha=Math.max(0,1-k);
    cx.fillStyle='#FFD700';cx.font='bold 16px "Courier New",sans-serif';cx.textAlign='center';
    cx.fillText(f.text,f.x,f.y-k*34);cx.globalAlpha=1;cx.textAlign='left';
  });
  if(paused){cx.fillStyle='rgba(0,0,0,0.72)';cx.fillRect(0,0,BW,BH);
    cx.fillStyle='#fff';cx.font='bold 16px Courier New';cx.textAlign='center';
    cx.fillText('PAUSE',BW/2,BH/2);cx.textAlign='left';}
  nx.fillStyle='#06061a';nx.fillRect(0,0,60,60);
  if(nxt){const sh=nxt.shape,sw=sh[0].length,sh2=sh.length;
    const ox=Math.floor((4-sw)/2),oy=Math.floor((4-sh2)/2);
    sh.forEach((row,dy)=>row.forEach((v,dx)=>{
      if(v){nx.fillStyle=nxt.isSpecial?'#FFD700':nxt.color;
        nx.fillRect((ox+dx)*15+3,(oy+dy)*15+3,13,13);
        if(nxt.isSpecial){nx.shadowColor='#FFD700';nx.shadowBlur=5;
          nx.fillRect((ox+dx)*15+3,(oy+dy)*15+3,13,13);nx.shadowBlur=0;}}
    }));}
}

const SPEEDS=[{label:'通常',mul:1},{label:'×2',mul:2},{label:'×3',mul:3},{label:'skip',mul:12}];
let speedIdx=0;
function loop(t=0){
  const dt=t-lastT;lastT=t;
  if(dt>0&&dt<1000){
    const mul=SPEEDS[speedIdx].mul,step=dt*mul;
    if(going&&!paused&&!reading&&!over){
      if(sink){
        sinkCtr+=step;
        while(sinkCtr>=105&&sink){sinkCtr-=105;sinkStep();}
      }else if(autoOn){
        autoCtr+=step;
        while(autoCtr>=110&&!sink&&!over&&!reading){autoCtr-=110;autoStep();}
      }else{
        dropCtr+=step;
        while(dropCtr>=tickMs()&&!sink&&!over){dropCtr-=tickMs();drop();}
      }
    }
    floaters.forEach(f=>f.t+=dt);floaters=floaters.filter(f=>f.t<f.dur);
  }
  if(going){draw();ui();}
  requestAnimationFrame(loop);
}

function start(){
  board=mkBoard();cnt=1;nxt=mkP(cnt);
  score=0;lines=0;lvl=1;over=false;going=true;paused=false;
  sink=null;dropCtr=0;sinkCtr=0;floaters=[];combo=0;
  autoTarget=null;autoTargetPiece=null;autoCtr=0;
  document.getElementById('chain-pop').innerHTML='';
  cv.classList.remove('spec-fall');
  document.getElementById('spec-lbl').textContent='';
  document.getElementById('ov').style.display='none';
  document.getElementById('pause-btn').style.display='flex';
  document.getElementById('pause-btn').textContent='⏸';
  document.getElementById('el-best').textContent=getBest().toLocaleString();
  spawnNext();
}

const moveL=()=>{if(!going||over||sink||!cur||paused||reading)return;if(fits(cur.shape,cur.x-1,cur.y))cur.x--;};
const moveR=()=>{if(!going||over||sink||!cur||paused||reading)return;if(fits(cur.shape,cur.x+1,cur.y))cur.x++;};
const rotatePc=()=>{
  if(!going||over||sink||!cur||paused||reading)return;
  const rs=rotSh(cur.shape);
  if(fits(rs,cur.x,cur.y))cur.shape=rs;
  else if(fits(rs,cur.x-1,cur.y)){cur.shape=rs;cur.x--;}
  else if(fits(rs,cur.x+1,cur.y)){cur.shape=rs;cur.x++;}
};
const soft=()=>{if(!going||over||sink||!cur||paused||reading)return;if(fits(cur.shape,cur.x,cur.y+1))cur.y++;else land();};
const hard=()=>{if(!going||over||sink||!cur||paused||reading)return;while(fits(cur.shape,cur.x,cur.y+1))cur.y++;land();};
const toggleP=()=>{if(!going||over||reading)return;paused=!paused;document.getElementById('pause-btn').textContent=paused?'▶':'⏸';};

document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  if(e.key==='ArrowLeft'||e.key==='a')moveL();
  if(e.key==='ArrowRight'||e.key==='d')moveR();
  if(e.key==='ArrowUp'||e.key==='w')rotatePc();
  if(e.key==='ArrowDown'||e.key==='s')soft();
  if(e.key===' ')hard();
  if(e.key==='p'||e.key==='Escape')toggleP();
});

[['bl',moveL],['br',moveR],['brot',rotatePc],['bd',soft],['bhd',hard]].forEach(([id,fn])=>{
  document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();fn();});
});
document.getElementById('start-btn').addEventListener('click',start);
document.getElementById('pause-btn').addEventListener('click',toggleP);
document.getElementById('auto-btn').addEventListener('click',()=>{
  autoOn=!autoOn;autoTarget=null;autoTargetPiece=null;
  const b=document.getElementById('auto-btn');
  b.textContent='AUTO: '+(autoOn?'ON':'OFF');b.classList.toggle('on',autoOn);
  if(!autoOn){
    speedIdx=0;
    const sb=document.getElementById('speed-btn');
    sb.textContent='速度: '+SPEEDS[0].label;sb.classList.remove('fast');
  }
});
document.getElementById('speed-btn').addEventListener('click',()=>{
  speedIdx=(speedIdx+1)%SPEEDS.length;
  const b=document.getElementById('speed-btn');
  b.textContent='速度: '+SPEEDS[speedIdx].label;
  b.classList.toggle('fast',speedIdx>0);
});

renderFragCounter();
requestAnimationFrame(loop);
</script>
</body>
