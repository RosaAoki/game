<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ありんこドット：Emergence World―感染個体を隔離してください―</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --loam:#3a2a1f; --deep:#231812; --crumb:#5b4433; --paper:#efe4cc; --dim:#bba98b;
  --sand:#cdb993; --leaf:#93b85c;
  --dot:"DotGothic16",ui-monospace,"Courier New",monospace;
  font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic","Rounded Mplus 1c",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--loam);color:var(--paper);-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;display:flex;justify-content:center;overscroll-behavior:none}
.app{width:100%;max-width:440px;padding:12px 12px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;gap:8px}
h1{font-size:19px;margin:0;font-weight:700;flex:1;letter-spacing:.03em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{background:var(--crumb);padding:7px 12px;border-radius:999px;font-size:13px;line-height:1}
.chip[aria-pressed="true"]{background:var(--paper);color:var(--deep)}
.chip.ghost{background:none;box-shadow:inset 0 0 0 1.5px var(--crumb)}
.guide{font-size:12.5px;color:var(--dim);margin:0;line-height:1.7}
#menu{display:flex;flex-direction:column;gap:12px}
#menu[hidden]{display:none}
#menu .btn{margin-top:4px}
.stage{position:relative;background:var(--sand);border-radius:22px 22px 8px 8px;overflow:hidden;box-shadow:inset 0 -10px 0 rgba(58,42,31,.18)}
canvas{display:block;width:100%}
.left{position:absolute;top:8px;right:12px;font-size:12px;color:#6b5540;font-weight:700}
.waitroom{position:absolute;top:31px;right:10px;width:116px;min-height:58px;border:2px solid rgba(91,68,51,.58);border-radius:9px;background:rgba(239,228,204,.72);padding:5px 6px 6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);pointer-events:none}
.waitroom-title{font-size:9px;font-weight:700;color:#6b5540;line-height:1;margin-bottom:4px;letter-spacing:.08em}
.waitants{position:relative;height:34px;overflow:hidden}
#waitcv{position:absolute;inset:0;width:100%;height:100%}
.waitant{position:absolute;width:7px;height:5px;border-radius:50%;box-shadow:2px 0 0 -1px currentColor;animation:waitwobble var(--d) ease-in-out infinite alternate;transform-origin:center}
.waitant:before,.waitant:after{content:"";position:absolute;width:4px;height:1px;background:currentColor;left:1px;top:-2px;transform:rotate(var(--r))}
.waitant:after{top:auto;bottom:-2px;transform:rotate(calc(var(--r) * -1))}
@keyframes waitwobble{from{transform:translate(0,1px) rotate(-8deg)}to{transform:translate(var(--dx),-2px) rotate(8deg)}}
.waitroom.empty .waitants:before{content:"隔離中の鬼アリなし";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;color:#9a876d;z-index:1}
.hud{position:absolute;top:7px;left:12px;display:flex;gap:10px;font-size:12px;font-weight:700;color:#6b5540;pointer-events:none}
.hud .oni{color:#a3262b}.hud .q{color:#4d7a2a}.hud .stall{color:#d8323a;animation:stallblink 1s steps(2) infinite}
@keyframes stallblink{50%{opacity:.35}}
.traits{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 14px}
.trait{display:flex;align-items:center;gap:5px;font-size:12.5px;background:#e3d6ba;border-radius:999px;padding:4px 10px 4px 5px}
.trait i{width:14px;height:14px;border-radius:4px;display:inline-block}
.stats{font-size:13px;color:#5b4433;margin:-6px 0 12px}
.nest{display:flex;gap:6px}
.pit{flex:1;min-width:0;height:50px;border-radius:25px 25px 12px 12px;background:var(--deep);box-shadow:inset 0 5px 9px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:5px;position:relative}
.pit.extra{box-shadow:inset 0 5px 9px rgba(0,0,0,.6),0 0 0 2px var(--leaf)}
.tray{display:grid;gap:8px;padding-top:4px}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.box{width:100%;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.35)}
.pit .box{height:38px;font-size:14px;gap:3px}
.box.back{opacity:.42;transform:scale(.9);height:34px;font-size:13px}
.box.mystery{background:#6e5c4b!important;color:var(--paper)!important}
.box.done{visibility:hidden}
.more{font-size:12px;color:var(--dim);text-align:center}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--paper);color:var(--deep);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(35,24,18,.72);display:none;align-items:center;justify-content:center;padding:24px;z-index:5}
.overlay.on{display:flex}
.card{background:var(--paper);color:var(--deep);border-radius:22px;padding:22px;width:100%;max-width:340px;text-align:center}
.card h2{margin:0 0 6px;font-size:22px}.card p{margin:0 0 14px;font-size:14px;line-height:1.7;color:#5b4433}
.card canvas{width:auto;max-width:100%;margin:0 auto 14px;image-rendering:pixelated;border-radius:6px}
.card canvas[hidden]{display:none}.card .row{display:flex;flex-direction:column;gap:8px}
.btn{background:var(--deep);color:var(--paper);padding:12px;border-radius:12px;font-weight:700;font-size:15px}
.btn.sub{background:none;color:var(--deep);box-shadow:inset 0 0 0 1.5px #b9a58a}
.autobar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.segs{display:inline-flex;background:var(--deep);border-radius:999px;padding:3px}
.seg{padding:6px 12px;border-radius:999px;font-size:12.5px;color:var(--dim)}
.seg[aria-pressed="true"]{background:var(--leaf);color:#1d2a10;font-weight:700}
.autohint{font-size:11.5px;color:var(--dim);flex:1;min-width:10em;line-height:1.5}
.box.pop{animation:pop .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{0%{transform:scale(.55);filter:brightness(1.6)}100%{transform:scale(1);filter:none}}
.overlay.rp{align-items:flex-start;overflow-y:auto;padding:16px 12px calc(28px + env(safe-area-inset-bottom))}
.report{position:relative;width:100%;max-width:400px;margin:auto;background:#f2e8d0;color:#3b2a1f;border-radius:6px;padding:16px 16px 12px;text-align:left;box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 0 0 6px #f2e8d0,inset 0 0 0 7.5px #6b5540}
.rp-head{display:flex;align-items:center;gap:10px;padding:4px 4px 10px;border-bottom:1.5px solid #6b5540}
.rp-icon canvas{width:40px;display:block;image-rendering:pixelated}.rp-title{flex:1;font-family:var(--dot);line-height:1.05}
.rp-title span{font-size:13px;letter-spacing:.08em}.rp-title strong{display:block;font-size:30px;font-weight:400;letter-spacing:.04em}
.rp-no{font-family:var(--dot);text-align:right;border-left:1.5px solid #6b5540;padding-left:10px;line-height:1.2}
.rp-no small{display:block;font-size:9.5px;color:#7a6650}.rp-no b{font-size:20px;font-weight:400}
.stamp{position:absolute;right:10px;top:96px;font-family:var(--dot);font-size:26px;line-height:1;padding:3px 10px;border:4px double currentColor;border-radius:8px;transform:rotate(-12deg);opacity:.86;mix-blend-mode:multiply;animation:stamp .45s cubic-bezier(.2,1.5,.4,1) .3s both;pointer-events:none}
.stamp.ok{color:#c8322f}.stamp.ng{color:#2f3f6b}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.6);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.86}}
.rp-sum h3{margin:12px 0 4px;font-size:14px}.rp-sum p{margin:0;font-size:13.5px;line-height:1.7;max-width:57%}
.rp-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:10px}
.rp-box{border:1.5px solid #8a735a;border-radius:4px;padding:18px 10px 10px;position:relative;margin-top:16px;background:rgba(255,255,255,.2)}
.rp-box h4{position:absolute;top:-10px;left:8px;margin:0;background:#4a3527;color:#f2e8d0;font-family:var(--dot);font-weight:400;font-size:11.5px;letter-spacing:.06em;padding:2px 14px 2px 8px;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.spec{text-align:center}.rp-art canvas{width:100%;max-width:130px;image-rendering:pixelated}.rp-name{margin:6px 0 0;font-weight:700;font-size:14px}.rp-tag{margin:0;font-size:11px;color:#7a6650}
.report table{width:100%;border-collapse:collapse;font-size:12px}.report th{font-weight:400;text-align:left;padding:5px 0;border-bottom:1px dashed #b9a58a;white-space:nowrap}.report td{text-align:right;font-family:var(--dot);font-size:15px;border-bottom:1px dashed #b9a58a}
.ic{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:1px}.ic.cube{background:#c9a27a}.ic.born{background:#c8322f}.ic.inf{background:#6b2a6b}.ic.cure{background:#7fb04f}.ic.q{background:#7a8a99}.ic.peak{background:#3b2a1f}
.report .traits{justify-content:flex-start;margin:0}.note p{margin:0;font-size:13.5px;line-height:1.7}.report .row{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.rp-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:12px;font-family:var(--dot);font-size:10px;color:#7a6650}.rp-foot span:last-child{text-align:right}
@media (prefers-reduced-motion:reduce){.shake,.stamp,.box.pop{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
<header><h1>ありんこドット：<small style="font-size:12px;color:var(--dim)">Emergence World <br>―感染個体を隔離してください―</small></h1>
  <button class="chip ghost" id="retry" hidden>やり直す</button>
  <button class="chip ghost" id="toMenu" hidden>← メニューに戻る</button>
  <button class="chip ghost" id="endGameBtn" hidden style="box-shadow:inset 0 0 0 1.5px #c8322f;color:#e8a0a0">終了</button>
</header>
<div id="menu">
  <div class="chips" id="levels"></div>
  <p class="guide">箱をタップすると、箱からアリが出てきて絵を外側から食べます。食べ終わったアリは穴へ帰ります。鬼アリは近くの同じ色のアリを鬼にし、ちがう色のアリに会うと元に戻ります。鬼はタップで隔離。</p>
  <button class="btn" id="startBtn" style="width:100%">スタート</button>
</div>
<div id="playArea" hidden>
<div class="autobar"><div class="segs" id="auto" role="group" aria-label="操作モード"></div><span class="autohint" id="autoHint"></span></div>
<div class="stage">
<canvas id="cv"></canvas>
<div class="hud"><span id="hNest"></span><span class="oni" id="hOni"></span><span class="q" id="hQ"></span><span class="stall" id="hStall"></span></div>
<div class="left" id="left"></div>
<div class="waitroom empty" id="waitroom"><div class="waitroom-title">隔離所</div><div class="waitants" id="waitants"><canvas id="waitcv" width="104" height="34"></canvas></div></div>
</div>
<div class="nest" id="nest"></div>
<div class="tray" id="tray"></div>
</div>
</div>
<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast" role="status"></div>
<div class="overlay" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovt"><div id="card" class="card"></div></div>

<script>
"use strict";

function rngOf(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function fromRows(rows,map){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length,keys=Object.keys(map);
  const grid=new Int16Array(w*h).fill(-1);
  rows.forEach((r,y)=>{for(let x=0;x<w;x++){const k=keys.indexOf(r[x]);if(k>=0)grid[y*w+x]=k}});
  return{w,h,grid,palette:keys.map(k=>map[k])};
}
function diamond(){
  const w=14,h=18,grid=new Int16Array(w*h),cx=6.5,cy=8.5;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const d=Math.abs(x-cx)+Math.abs(y-cy);grid[y*w+x]=d<3.5?2:d<7.5?1:0}
  return{w,h,grid,palette:["#e2507a","#3fb7cf","#d6db3c"]};
}
function mushroom(){
  return fromRows([
    "................",".....RRRRRR.....","...RRWWRRRRRR...","..RRWWWRRRWWRR..",".RRRRWRRRRWWWRR.",
    ".RRRRRRRRRRWRRR.","RRWWRRRRRRRRRRRR","RWWWWRRRRWWRRRRR","RRWWRRRRWWWWRRRR",
    ".RRRRRRRRWWRRRR.","....SSSSSSSS....","....SSKSSKSS....","....SSSSSSSS....",
    "....SSSPPSSS....",".....SSSSSS.....","GGG..........GGG","GGGGGGGGGGGGGGGG"
  ],{R:"#d8443c",W:"#f7f0e2",S:"#e9c894",K:"#232a4a",P:"#ef8fa0",G:"#6aa34a"});
}
function sunset(){
  const w=18,h=18,grid=new Int16Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let c=y<5?0:y<9?1:2;const dx=x-8.5,dy=y-11;if(dx*dx+dy*dy<16)c=3;
    if(y>12.5+1.6*Math.sin(x/2.6+.5))c=4;if(y>15+1.1*Math.sin(x/2+2))c=5;grid[y*w+x]=c;
  }
  return{w,h,grid,palette:["#2c3870","#6c4c9e","#e0708a","#f5c542","#57a24e","#2f6b3a"]};
}
function outlined(L,color,frame){
  const w=L.w+2,h=L.h+2,grid=new Int16Array(w*h).fill(-1),o=L.palette.length;
  for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++)grid[(y+1)*w+x+1]=L.grid[y*L.w+x];
  const src=Int16Array.from(grid);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(src[i]>=0)continue;
    let near=frame&&(x===0||y===0||x===w-1||y===h-1);
    for(let dy=-1;dy<=1&&!near;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<w&&Y<h&&src[Y*w+X]>=0){near=true;break}}
    if(near)grid[i]=o;
  }
  return{w,h,grid,palette:[...L.palette,color]};
}
const LEVELS=[
  {name:"1",make:diamond,jitter:4,mystery:0,oni:{first:.5,mean:30}},
  {name:"2",make:()=>outlined(mushroom(),"#6b4226"),jitter:16,big:.8,mystery:.15,oni:{first:.2,mean:9}},
  {name:"3",make:()=>outlined(sunset(),"#b8863b",true),jitter:24,big:.7,mystery:.25,oni:{first:.15,mean:7}}
];
let customLevel=null;

function computeOut(g,w,h){
  const n=w*h,out=new Uint8Array(n),q=[];
  const seed=i=>{if(g[i]<0&&!out[i]){out[i]=1;q.push(i)}};
  for(let x=0;x<w;x++){seed(x);seed((h-1)*w+x)}
  for(let y=0;y<h;y++){seed(y*w);seed(y*w+w-1)}
  while(q.length){const i=q.pop(),x=i%w,y=(i/w)|0;if(x>0)seed(i-1);if(x<w-1)seed(i+1);if(y>0)seed(i-w);if(y<h-1)seed(i+w)}
  return out;
}
function exposedFrom(g,w,h,out){
  const n=w*h,ex=new Uint8Array(n);
  for(let i=0;i<n;i++){if(g[i]<0)continue;const x=i%w,y=(i/w)|0;
    if(x===0||y===0||x===w-1||y===h-1||out[i-1]||out[i+1]||out[i-w]||out[i+w])ex[i]=1}
  return ex;
}
function computeExposed(g,w,h){return exposedFrom(g,w,h,computeOut(g,w,h))}
function nearest(g,ex,w,color,res,hx,hy){
  let best=-1,bd=Infinity;
  for(let i=0;i<g.length;i++){if(g[i]!==color||!ex[i]||(res&&res[i]))continue;
    const dx=i%w+.5-hx,dy=((i/w)|0)+.5-hy,d=dx*dx+dy*dy;if(d<bd){bd=d;best=i}}
  return best;
}
const holeOf=L=>({x:L.w/2,y:L.h+1.5});

function planBoxes(L,rng,big=1){
  const{w,h}=L,g=Int16Array.from(L.grid),P=L.palette.length,H=holeOf(L);
  let left=0;for(const v of g)if(v>=0)left++;
  const minB=Math.max(5,Math.round(left*big/30)),maxB=Math.max(minB+8,Math.round(left*big/9));
  const boxes=[];let ex=computeExposed(g,w,h);
  while(left>0){
    const cnt=new Array(P).fill(0);for(let i=0;i<g.length;i++)if(g[i]>=0&&ex[i])cnt[g[i]]++;
    const wts=cnt.map(c=>c*c),sum=wts.reduce((a,b)=>a+b,0);if(!sum)break;
    let r=rng()*sum,c=0;while(r>=wts[c]){r-=wts[c];c++}
    const k=minB+Math.floor(rng()*(maxB-minB+1));let eaten=0;
    while(eaten<k){const t=nearest(g,ex,w,c,null,H.x,H.y);if(t<0)break;g[t]=-1;ex=computeExposed(g,w,h);eaten++;left--}
    const prev=boxes[boxes.length-1];if(prev&&prev.color===c&&prev.n+eaten<=maxB*1.3)prev.n+=eaten;else boxes.push({color:c,n:eaten});
  }
  return boxes;
}
function solvable(L,cols0,slotsN){
  const{w,h}=L,g=Int16Array.from(L.grid),H=holeOf(L);let ex=computeExposed(g,w,h);
  const cols=cols0.map(c=>c.map(b=>({color:b.color,n:b.left})));
  let left=0;for(const v of g)if(v>=0)left++;let slots=[];
  const canEat=c=>nearest(g,ex,w,c,null,H.x,H.y)>=0;
  while(left>0){
    while(slots.length<slotsN){
      const f=cols.filter(c=>c.length);if(!f.length)break;
      const good=f.find(c=>canEat(c[0].color));
      if(good)slots.push(good.shift());else if(!slots.some(s=>canEat(s.color)))slots.push(f[0].shift());else break;
    }
    let prog=false;
    for(const s of slots){const t=nearest(g,ex,w,s.color,null,H.x,H.y);if(t>=0){g[t]=-1;ex=computeExposed(g,w,h);s.n--;left--;prog=true}}
    slots=slots.filter(s=>s.n>0);if(!prog)return false;
  }
  return true;
}
function buildLayout(L,seed,cfg){
  let fallback=null;
  for(let attempt=0;attempt<30;attempt++){
    const rng=rngOf(seed+attempt*7919),base=planBoxes(L,rng,cfg.big||1);
    const jit=cfg.jitter*Math.max(0,1-attempt/20);
    const order=base.map((b,i)=>({b,k:i+rng()*jit})).sort((a,c)=>a.k-c.k).map(x=>x.b);
    const cols=deal(order,rng,cfg);if(solvable(L,cols,5))return cols;if(!fallback)fallback=deal(base,rng,cfg);
  }
  return fallback;
}
function deal(order,rng,cfg){
  const nc=order.length>27?4:3,cols=Array.from({length:nc},()=>[]);
  order.forEach((b,i)=>{const col=cols[i%nc];col.push({color:b.color,left:b.n,pending:0,spawn:0,mystery:col.length>0&&rng()<cfg.mystery})});
  return cols;
}

function imageToLevel(img,side=20,k=6){
  const s=side/Math.max(img.naturalWidth,img.naturalHeight);
  const w=Math.max(6,Math.round(img.naturalWidth*s)),h=Math.max(6,Math.round(img.naturalHeight*s));
  let src=img,sw=img.naturalWidth,sh=img.naturalHeight;
  while(sw/2>w*2){const c=document.createElement("canvas");c.width=sw=Math.round(sw/2);c.height=sh=Math.round(sh/2);c.getContext("2d").drawImage(src,0,0,sw,sh);src=c}
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(src,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data,pts=[],idx=[];
  for(let i=0;i<w*h;i++){if(d[i*4+3]<128)continue;pts.push([d[i*4],d[i*4+1],d[i*4+2]]);idx.push(i)}
  if(pts.length<8)return null;

function stepWaitroom(dt){
  if(!waitctx)return;
  const W=104,H=34,speed=1.1; // 盤面より遅め。お仕事はないので、のんびり歩くだけ
  for(const q of G.quar){
    if(q.wx==null){q.wx=6+Math.random()*(W-12);q.wy=6+Math.random()*(H-12);q.wang=Math.random()*7;q.walk=Math.random()*6;q.healFx=0}
    q.wang+=(Math.random()-.5)*1.4*dt*20;
    let nx=q.wx+Math.cos(q.wang)*speed*dt*20,ny=q.wy+Math.sin(q.wang)*speed*dt*20;
    if(nx<5||nx>W-5)q.wang=Math.PI-q.wang;if(ny<5||ny>H-5)q.wang=-q.wang;
    q.wx=Math.min(W-5,Math.max(5,nx));q.wy=Math.min(H-5,Math.max(5,ny));q.walk+=dt*14;
    const recovering=q.t>QTIME-5;
    if(q._wasRecovering===undefined)q._wasRecovering=recovering;
    if(q._wasRecovering&&!recovering)q.healFx=.9; // ちょうど治った瞬間
    q._wasRecovering=recovering;
    if(q.healFx>0)q.healFx=Math.max(0,q.healFx-dt);
  }
  waitctx.clearRect(0,0,W,H);
  for(const q of G.quar){
    const col=G.L.palette[q.color],recovering=q.t>QTIME-5;
    if(q.healFx>0){
      const k=1-q.healFx/.9;waitctx.save();waitctx.globalAlpha=Math.max(0,1-k);
      waitctx.strokeStyle="rgb(110,180,60)";waitctx.lineWidth=1.2;

      waitctx.fillText("治った！",q.wx,q.wy-9-k*6);waitctx.restore();

}

function spawnEntryPoint(box){
  let x=G.L.w/2;
  if(box.el){
    const br=box.el.getBoundingClientRect(),cr=cv.getBoundingClientRect();
    if(cr.width>0&&br.width>0)x=(br.left+br.width/2-cr.left-view.ox)/view.cell;
  }
  return {
    x:Math.min(G.L.w-.35,Math.max(.35,x)),
    y:G.L.h+MB-.3 // プレイゾーン(歩ける範囲)の一番下ぎりぎり
  };
}
function spawnPathToBoard(box){
  const p=spawnEntryPoint(box);

function newAnt(o){const col=G.L.palette[o.color];return{walk:Math.random()*6,ang:-Math.PI/2,carry:-1,box:null,target:-1,path:[],immune:0,...o,body:shade(col,-.12),dark:shade(col,-.45)}}
function sendToJob(a,job,B){const v=viaOf(B,job.target);if(!v||G.g[job.target]<0)return false;a.phase="go";a.box=job.box;a.target=job.target;a.carry=-1;a.path=pathVia(B,v.via,cubeCenter(job.target));return true}
function dropJob(job){if(job&&G.res[job.target]){G.res[job.target]=0;job.box.pending--}}
function step(dt){
  refresh();
  const{L,g,res}=G;

  for(const b of G.slots){
    if(!b)continue;b.spawn-=dt;
    while(b.spawn<=0&&b.left-b.pending>0&&G.idle>0){
      const T=pickTarget(G.holeBfs,b.color);if(!T){b.spawn=0;break}
      res[T.target]=1;b.pending++;b.spawn+=GAP;G.idle--;
      if(b.el){const sp=b.el.querySelector("span");if(sp)sp.textContent=b.left-b.pending}

      const spawn=spawnPathToBoard(b);
      const a=newAnt({
        x:spawn.x+(Math.random()-.5)*.22,
        y:spawn.y,
        color:b.color,
        phase:"go",
        box:b,
        target:T.target
      });

      const entryBfs=bfs(cellOf(spawn.x,G.L.h-.35));
      const entryVia=viaOf(entryBfs,T.target);
      a.path=entryVia
        ? [...spawn.path,...pathVia(entryBfs,entryVia.via,cubeCenter(T.target))]
        : [...spawn.path];

      G.ants.push(a);
    }
  }

  let uiNum=false,slotsChanged=false;
  for(const a of G.ants.slice()){
    a.walk+=dt*28;if(a.immune>0)a.immune-=dt;
    if(!follow(a,SPEED,dt))continue;

    if(a.phase==="go"){
      const b=a.box;g[a.target]=-1;res[a.target]=0;G.exDirty=true;G.left--;
      b.left--;b.pending--;a.carry=b.color;a.phase="back";a.box=null;uiNum=true;
      refresh();
      a.path=homePath(a.x,a.y);
      if(b.left===0){
        const i=G.slots.indexOf(b);
        if(i>=0){G.slots[i]=null;slotsChanged=true}
      }
    }else{
      G.ants.splice(G.ants.indexOf(a),1);G.idle++;
    }
  }

  stepOni(dt);
  autoStep(dt);
  stepStall(dt);
  stepBalance(dt);

  if(slotsChanged)renderNest();
  else if(uiNum)for(const b of G.slots)if(b&&b.el){const span=b.el.querySelector("span");if(span)span.textContent=b.left-b.pending}
  if(uiNum)document.getElementById("left").textContent="残り "+G.left;
  renderHud();

  if(G.state!=="play")return;
  if(G.left===0){G.endT+=dt;if(G.endT>.9&&!G.ants.length)win();return}
  if(G.idle+G.ants.length===0&&G.oni.length){lose();return}
  if(G.ants.length||G.idle===0)return;
  if(G.oni.some(o=>o.job)||G.quar.some(q=>q.job))return;
  refresh();
  const canMove=G.slots.some(b=>b&&b.left-b.pending>0&&pickTarget(G.holeBfs,b.color));
  const canTap=G.slots.includes(null)&&G.cols.some(c=>c.length);
  if(!canMove&&!canTap)stuck();
}
function stepStall(dt){
  if(G.state!=="play"||G.stallDisabled)return;
  if(!G.oni.length){G.stallT=0;G.stallSnap=null;return}
  const snap=G.left+","+G.stats.infect+","+G.stats.cure;
  if(snap!==G.stallSnap){G.stallSnap=snap;G.stallT=0;return}
  G.stallT+=dt;if(G.stallT>=STALL_WARN+STALL_GRACE){G.state="lose";G.stats.stalled=true;showReport(false)}
}
function stepBalance(dt){
  if(G.state!=="play"||G.balanceShown)return;
  if(G.oni.length>0&&G.left===G.oni.length){
    G.balanceT+=dt;
    if(G.balanceT>=10){
      G.balanceShown=true;G.stallDisabled=true;
      showDialog("終了条件を満たしました","残りキューブと感染個体の数が釣り合っています。",[
        ["終了する",()=>{G.state="lose";showMutationReport()}],
        ["続行する",()=>{hideOverlay();document.getElementById("endGameBtn").hidden=false;toast("終了するには、右上の「終了」ボタンを押してください")},true]
      ]);
    }
  }else G.balanceT=0;
}

function makeOni(x,y,color,job){
  const col=G.L.palette[color];refresh();const W=navW(),ex=Math.floor(x)+MX,ey=Math.floor(y)+MT;
  if(ex<0||ey<0||ex>=W||ey>=navH()||!G.pass[ey*W+ex]){[x,y]=cellCenter(cellOf(x,y));}
  G.oni.push({x,y,color,job,t:G.traits[color].pulse,path:[],repath:0,age:0,walk:0,ang:0,carry:-1,body:shade(col,-.3),dark:"#3a0c10"});
  G.stats.peak=Math.max(G.stats.peak,G.oni.length);

function infect(a){

function revive(o,x,y,fromHole){
  const a=newAnt({x,y,color:o.color,phase:"back",immune:IMMUNE});
  if(o.job){
    refresh();const B=fromHole?G.holeBfs:bfs(cellOf(x,y));
    if(sendToJob(a,o.job,B)){G.ants.push(a);return}

function quarantine(o,auto){

  G.oni.splice(G.oni.indexOf(o),1);

  renderWaitroom();
  addFx({kind:"ring",x:o.x,y:o.y,r0:.2,r1:nice?2.1:1.6,dur:nice?.6:.45,color:nice?"rgb(240,190,60)":"rgb(90,150,60)"});
  const msg=auto?"隔離（オート）":nice?"ナイスキャッチ！":"捕まえた！";
  addFx({kind:"text",x:o.x,y:o.y,text:msg,big:nice,dur:nice?1.3:.9,color:nice?"rgb(190,130,20)":"rgb(70,130,40)"});

function nearestAnt(o,maxD,sameOnly,goOnly){
  let best=null,bd=maxD*maxD;
  for(const a of G.ants){if(a.immune>0||(sameOnly&&a.color!==o.color)||(goOnly&&a.phase!=="go"))continue;const d=(a.x-o.x)**2+(a.y-o.y)**2;if(d<bd){bd=d;best=a}}
  return best;
}
function addFx(f){G.fx.push({t:0,...f})}
function stepOni(dt){
  for(const f of G.fx)f.t+=dt;G.fx=G.fx.filter(f=>f.t<f.dur);if(G.state!=="play")return;
  G.clock+=dt;const cfg=G.cfg.oni;
  if(G.omen<0&&G.left>0){const due=G.firstDone?G.clock>=G.nextOniAt:(1-G.left/G.total)>=cfg.first;if(due){G.omen=OMEN;toast("不穏な気配……")}}
  else if(G.omen>=0){G.omen-=dt;if(G.omen<0){const ok=G.ants.filter(a=>a.immune<=0),pool=ok.filter(a=>a.phase==="go"),cand=pool;
    if(cand.length){infect(cand[Math.floor(Math.random()*cand.length)]);G.stats.infect--;G.stats.born++;G.firstDone=true;G.nextOniAt=G.clock+Math.max(6,-Math.log(1-Math.random())*cfg.mean)}else G.omen=0}}
  for(const o of G.oni.slice()){
    if(!G.oni.includes(o))continue;const tr=G.traits[o.color];o.age+=dt;o.walk+=dt*22;o.repath-=dt;
    if(o.repath<=0||!o.path.length){o.repath=.4;const prey=nearestAnt(o,6,true)||nearestAnt(o,6,false),B=bfs(cellOf(o.x,o.y));
      if(prey){const c=cellOf(prey.x,prey.y);if(B.dist[c]>=0)o.path=smooth(chain(B,c).map(cellCenter))}
      else if(!o.path.length){const W=navW(),H=navH();for(let k=0;k<25;k++){const c=Math.floor(Math.random()*W*H),cy=(c/W)|0;if(B.dist[c]>0&&cy<G.L.h+MT+1){o.path=smooth(chain(B,c).map(cellCenter));break}}}
      if(o.path.length>1&&clearLine([o.x,o.y],o.path[1]))o.path.shift()}
    follow(o,tr.speed,dt);o.t-=dt;
    if(o.t<=0){o.t=tr.pulse;addFx({kind:"ring",x:o.x,y:o.y,r0:.3,r1:RANGE,dur:.5,color:"rgb(200,40,50)"});const a=nearestAnt(o,RANGE,false);
      if(!a)addFx({kind:"text",x:o.x,y:o.y,text:"……",dur:.8,color:"rgb(120,90,70)"});else if(a.color===o.color){if(a.phase!=="back")infect(a)}else cure(o,"もどった！")}
  }
  // 隔離所：時間が来たら、元気なアリとして巣へ戻す（仕事はもう手放し済みなので、ただ戻すだけでいい）
  for(const q of G.quar.slice()){q.t-=dt;
    if(q.t<=0){G.quar.splice(G.quar.indexOf(q),1);
      if(q.job){
        refresh();const a=newAnt({x:G.hole.x,y:G.hole.y,color:q.color,phase:"back",immune:IMMUNE});
        if(sendToJob(a,q.job,G.holeBfs))G.ants.push(a);else{dropJob(q.job);G.idle++}
      }else G.idle++;
      renderWaitroom();
    }}
}
function autoStep(dt){

  if(G.slots.includes(null)){refresh();const fronts=G.cols.map((c,i)=>[c[0],i]).filter(x=>x[0]);let pick=fronts.find(([b])=>pickTarget(G.holeBfs,b.color));
    if(!pick&&fronts.length&&!G.ants.length&&!G.oni.some(o=>o.job)&&!G.quar.some(q=>q.job)&&!G.slots.some(b=>b&&b.left-b.pending>0&&pickTarget(G.holeBfs,b.color)))pick=fronts[0];if(pick)placeBox(pick[1],true)}

  card.innerHTML=`<header class="rp-head"><span class="rp-icon"></span><div class="rp-title"><span>ARINKO DOT</span><strong id="ovt">MUTATION RECORD</strong></div><div class="rp-no"><small>REPORT No.</small><b>${no}</b><small>Field Observation Record</small></div></header>
  <div class="stamp" style="color:#6b4a99" aria-label="記録">SNAPSHOT</div>
  <section class="rp-sum"><h3>プレイヤーの意思による観測終了</h3><p>残り${G.left}個・感染${G.oni.length}匹で均衡し、10秒経過。</p><p>キューブ${eaten}個を確認。</p></section>
  <div class="rp-grid"><section class="rp-box spec"><h4>SPECIMEN</h4><div class="rp-art"></div><p class="rp-name">${base}</p><p class="rp-tag">（観測継続中に終了）</p></section>
  <section class="rp-box"><h4>DATA</h4><table>${rows.map(([k,l,v])=>`<tr><th><i class="ic ${k}"></i>${l}</th><td>${v}</td></tr>`).join("")}</table></section></div>
  <section class="rp-box"><h4>AGENT TRAITS</h4><div class="traits">${G.L.palette.map((c,i)=>`<span class="trait"><i style="background:${c}"></i>${G.traits[i].name}</span>`).join("")}</div></section>
  <section class="rp-box note"><h4>FIELD NOTE</h4><p>${MUTATION_NOTES[n-1]}</p></section><div class="row" id="ovb"></div>
  <footer class="rp-foot"><span>MODE: ${G.mode}</span><span>— Arinko Dot —</span><span>Small steps,<br>Big discoveries.</span></footer>`;
  card.querySelector(".rp-icon").appendChild(artCanvas(40));card.querySelector(".rp-art").appendChild(artCanvas(150));
  const row=card.querySelector("#ovb");
  const b=document.createElement("button");b.className="btn";b.textContent="もう一度";b.onclick=()=>{seed=Date.now()%100000;start()};row.appendChild(b);
  ov.classList.add("on","rp");ov.scrollTop=0;row.firstChild.focus({preventScroll:true});
}
function showDialog(title,text,buttons){
  const card=document.getElementById("card");card.className="card";card.innerHTML=`<h2 id="ovt"></h2><p></p><div class="row" id="ovb"></div>`;
  card.querySelector("h2").textContent=title;card.querySelector("p").textContent=text;const row=card.querySelector("#ovb");
  buttons.forEach(([t,f,sub])=>{const b=document.createElement("button");b.className="btn"+(sub?" sub":"");b.textContent=t;b.onclick=f;row.appendChild(b)});
  ov.classList.remove("rp");ov.classList.add("on");row.firstChild.focus();
}
function hideOverlay(){ov.classList.remove("on","rp")}
function win(){G.state="win";showReport(true)}function lose(){G.state="lose";showReport(false)}
function stuck(){
  G.state="stuck";const btns=[];if(!G.extra)btns.push(["待機所を1つ増やす",()=>{G.extra=true;G.slots.push(null);G.state="play";hideOverlay();renderNest()}]);
  btns.push(["最初からやり直す",()=>start(),btns.length>0]);showDialog("進めなくなりました","待機所が埋まっていて、どのアリも食べられるキューブに届きません。",btns);
}
let toastT;function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),1300)}

document.getElementById("retry").onclick=()=>start();
let inMenu=true;
function setMenuVisible(v){
  document.getElementById("menu").hidden=!v;
  document.getElementById("playArea").hidden=v;
  document.getElementById("retry").hidden=v;
  document.getElementById("toMenu").hidden=v;
  if(v)document.getElementById("endGameBtn").hidden=true;
  inMenu=v;
}
function goPlay(){seed=Date.now()%100000;setMenuVisible(false);start()}
document.getElementById("startBtn").onclick=goPlay;
document.getElementById("toMenu").onclick=()=>setMenuVisible(true);
document.getElementById("endGameBtn").onclick=()=>{if(G.state==="play"){G.state="lose";showMutationReport()}};
renderLevels();
document.getElementById("file").addEventListener("change",e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{const L=imageToLevel(img);URL.revokeObjectURL(url);if(!L){toast("この画像からは絵を作れませんでした");return}customLevel=L;current={kind:"custom"};goPlay()};
  img.onerror=()=>{URL.revokeObjectURL(url);toast("画像を読み込めませんでした")};img.src=url;
});
window.addEventListener("resize",()=>{if(G)layout()});
window.__speed=1;let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(G&&!inMenu){for(let k=0;k<window.__speed;k++)step(dt);stepWaitroom(dt);draw()}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
